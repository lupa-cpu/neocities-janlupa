<!DOCTYPE html>
<html lang="en">
<html>
<head>
    <title>Index of /files</title>
    <link rel="stylesheet" type="text/css" media="screen" href="./filestyle.css">
</head>
<body>
    <div>
        <style type="text/css">
            @font-face {
                font-family: "hypnobold";
                src: url("hypno.ttf");
            }
        </style>
        <div>
            <h1>DIRECTORY FILE LIST</h1>
            <h2> \FLST\LUPA_FILES_AND_SHIT\ </h2>
            <head>
                <meta charset="utf-8" />
                <meta name="viewport" content="width=device-width, initial-scale=1" />
                <meta name="color-scheme" content="light dark" />
                <title>Index of {{root}}</title>
                {{style}}
            </head>
            <body>
                <h1>Index of {{root}}</h1>

                <ul>
                    {% for name, klass, target in items %}
                    <li{% if klass %} class="{{klass}}" {% endif %}>
                        <span class="{% if klass in icons %}icon{% else %}noicon{% endif %}"></span>
                        <a href="{{name}}" {% if target %} target="{{target}}" {% endif %}>{{name}}</a>
                        </li>
                        {% endfor %}
                </ul>
            </body>
</html>
